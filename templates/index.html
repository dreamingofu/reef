<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reef">

</head>
<body data-view="home">

<header class="top" id="top">
  <button class="hbtn top-back" id="top-back" aria-label="Back"><svg class="i"><use href="#i-chev-left"/></svg></button>
  <span class="top-title" id="top-title" aria-hidden="true"></span>
  <a class="brand" href="#home" aria-label="Reef home">
    <svg class="brand-logo" aria-hidden="true"><use href="#i-logo"/></svg>
    <span>Reef</span>
  </a>
  <div class="top-actions">
    <a class="hbtn" href="#downloads" aria-label="Downloads">
      <svg class="i"><use href="#i-download"/></svg>
      <span class="badge" id="hdr-badge" hidden></span>
    </a>
    <button class="hbtn hbtn-accent" id="status-btn" aria-label="Server status">
      <svg class="i"><use href="#i-server"/></svg>
      <span class="dot" id="status-dot"></span>
    </button>
  </div>
</header>

<main class="app">
  <section class="view" id="view-home"></section>
  <section class="view" id="view-search" hidden></section>
  <section class="view" id="view-kept" hidden></section>
  <section class="view" id="view-downloads" hidden></section>
  <section class="view" id="view-detail" hidden></section>
</main>

<div class="mini glass" id="mini" hidden>
  <button class="mini-open" id="mini-open" aria-label="Open player">
    <span class="mini-art"><img id="mini-art" alt=""></span>
    <span class="mini-text"><span class="mini-t" id="mini-t"></span><span class="mini-s" id="mini-s"></span></span>
  </button>
  <button class="icon-btn" id="mini-play" aria-label="Play"><svg class="i fill"><use href="#i-play"/></svg></button>
  <button class="icon-btn" id="mini-next" aria-label="Next"><svg class="i fill"><use href="#i-next"/></svg></button>
  <span class="mini-progress"><i id="mini-bar"></i></span>
</div>

<div class="dock" id="dock">
  <nav class="tabs glass" aria-label="Main">
    <a class="tab" data-view="home" href="#home"><svg class="i"><use href="#i-home"/></svg><span>Home</span></a>
    <a class="tab" data-view="kept" href="#kept"><svg class="i"><use href="#i-disc"/></svg><span>Kept</span></a>
    <a class="tab" data-view="downloads" href="#downloads"><svg class="i"><use href="#i-download"/></svg><span>Downloads</span><span class="badge" id="tab-badge" hidden></span></a>
  </nav>
  <a class="fab glass" href="#search" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></a>
</div>

<form class="searchbar" id="search-bar" role="search" autocomplete="off">
  <a class="fab glass sm" href="#home" aria-label="Home"><svg class="i"><use href="#i-home"/></svg></a>
  <label class="search-pill glass">
    <svg class="i"><use href="#i-search"/></svg>
    <input id="q" type="search" placeholder="Artists, songs, videos…" enterkeyhint="search" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button type="button" class="icon-btn sm" id="q-clear" aria-label="Clear" hidden><svg class="i"><use href="#i-x"/></svg></button>
  </label>
</form>

<section class="np" id="np" aria-hidden="true" aria-label="Now playing">
  <div class="np-bg"><img id="np-bg" alt=""></div>
  <div class="np-inner">
    <header class="np-top" id="np-grab">
      <button class="icon-btn" id="np-close" aria-label="Close player"><svg class="i"><use href="#i-chev-down"/></svg></button>
      <div class="np-eyebrow"><span>Now playing</span><strong id="np-from"></strong></div>
      <a class="icon-btn" id="np-yt" target="_blank" rel="noopener" aria-label="Open on YouTube"><svg class="i"><use href="#i-external"/></svg></a>
    </header>
    <div class="np-art-wrap"><img class="np-art" id="np-art" alt=""></div>
    <div class="np-lyrics" id="np-lyrics" role="region" aria-label="Lyrics"></div>
    <div class="np-title-row">
      <div class="np-titles"><h2 id="np-t"></h2><button class="np-s" id="np-s"></button></div>
      <button class="icon-btn" id="np-share" aria-label="Share"><svg class="i"><use href="#i-share"/></svg></button>
      <button class="keep none lg" id="np-keep" data-keep="" aria-label="Keep in library"><svg class="i"><use href="#i-plus"/></svg></button>
    </div>
    <div class="np-progress">
      <input type="range" id="np-seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <div class="np-times"><span id="np-cur">0:00</span><span class="qpill" id="np-src">YouTube · AAC</span><span id="np-rem">-0:00</span></div>
    </div>
    <div class="np-controls">
      <button class="icon-btn mode" id="np-shuffle" aria-label="Shuffle"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn xl" id="np-prev" aria-label="Previous"><svg class="i fill"><use href="#i-prev"/></svg></button>
      <button class="icon-btn xxl" id="np-play" aria-label="Play"><svg class="i fill"><use href="#i-play"/></svg></button>
      <button class="icon-btn xl" id="np-next" aria-label="Next"><svg class="i fill"><use href="#i-next"/></svg></button>
      <button class="icon-btn mode" id="np-repeat" aria-label="Repeat"><svg class="i"><use href="#i-repeat"/></svg><b>1</b></button>
    </div>
    <div class="np-device"><svg class="i"><use href="#i-device"/></svg><span>This device</span></div>
    <div class="np-bottom">
      <button class="round glass" id="np-lyr" aria-pressed="false" aria-label="Lyrics"><svg class="i"><use href="#i-lyrics"/></svg></button>
      <button class="round glass" id="np-keep2" data-keep="" aria-label="Keep in library"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="round glass" id="np-queue" aria-label="Up next"><svg class="i"><use href="#i-queue"/></svg></button>
      <button class="round glass" id="np-sleep" aria-label="Sleep timer"><svg class="i"><use href="#i-moon"/></svg><span class="badge" id="np-sleep-badge" hidden></span></button>
      <a class="round glass" href="#downloads" id="np-dl" aria-label="Downloads"><svg class="i"><use href="#i-download"/></svg></a>
    </div>
  </div>
</section>

<div class="sheet-wrap" id="status-sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet tall" role="dialog" aria-label="Server status">
    <div class="sheet-top"><div class="grabber"></div><h3>Server</h3></div>
    <div class="sheet-body"><ul class="status-list" id="status-list"></ul></div>
    <button class="btn-wide" data-close>Done</button>
  </div>
</div>

<div class="sheet-wrap" id="sources-sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet tall" role="dialog" aria-label="Sources">
    <div class="sheet-top"><div class="grabber"></div><div class="head-row st-top"><button class="icon-btn st-back" data-st="back" aria-label="Back to Server"><svg class="i"><use href="#i-chev-left"/></svg></button><h3>Sources</h3></div></div>
    <div class="sheet-body" id="sources-body"></div>
    <button class="btn-wide" data-close>Done</button>
  </div>
</div>

<div class="sheet-wrap" id="updates-sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet tall" role="dialog" aria-label="Updates">
    <div class="sheet-top"><div class="grabber"></div><div class="head-row st-top"><button class="icon-btn st-back" data-st="back" aria-label="Back to Server"><svg class="i"><use href="#i-chev-left"/></svg></button><h3>Updates</h3></div></div>
    <div class="sheet-body" id="updates-body"></div>
    <button class="btn-wide" data-close>Done</button>
  </div>
</div>

<div class="sheet-wrap" id="scrobble-sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet tall" role="dialog" aria-label="Scrobbling">
    <div class="sheet-top"><div class="grabber"></div><div class="head-row st-top"><button class="icon-btn st-back" data-st="back" aria-label="Back to Server"><svg class="i"><use href="#i-chev-left"/></svg></button><h3>Scrobbling</h3></div></div>
    <div class="sheet-body" id="scrobble-body"></div>
    <button class="btn-wide" data-close>Done</button>
  </div>
</div>

<div class="sheet-wrap" id="backup-sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet tall" role="dialog" aria-label="Backup">
    <div class="sheet-top"><div class="grabber"></div><div class="head-row st-top"><button class="icon-btn st-back" data-st="back" aria-label="Back to Server"><svg class="i"><use href="#i-chev-left"/></svg></button><h3>Backup</h3></div></div>
    <div class="sheet-body" id="backup-body"></div>
    <button class="btn-wide" data-close>Done</button>
  </div>
</div>

<div class="sheet-wrap" id="hidden-sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet tall" role="dialog" aria-label="Hidden artists">
    <div class="sheet-top"><div class="grabber"></div><h3>Hidden artists</h3></div>
    <div class="sheet-body" id="hidden-list"></div>
    <button class="btn-wide" data-close>Done</button>
  </div>
</div>

<div class="sheet-wrap" id="act-sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-label="Song actions">
    <div class="sheet-top"><div class="grabber"></div><div class="act-head" id="act-head"></div></div>
    <div class="menu" id="act-menu"></div>
  </div>
</div>

<div class="sheet-wrap" id="queue-sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet tall" role="dialog" aria-label="Up next">
    <div class="sheet-top">
      <div class="grabber"></div>
      <div class="head-row q-head"><h3>Up next</h3><div class="q-modes" id="q-modes"></div></div>
    </div>
    <div class="q-body" id="q-body"></div>
  </div>
</div>

<div class="sheet-wrap" id="sleep-sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-label="Sleep timer">
    <div class="sheet-top"><div class="grabber"></div><h3>Sleep timer</h3></div>
    <div class="menu" id="sleep-menu"></div>
  </div>
</div>

<div class="toast glass" id="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="auto" playsinline></audio>
<script id="tiles-data" type="application/json">{{ tiles|tojson }}</script>
<script src="/static/app.js"></script>
</body>
</html>
